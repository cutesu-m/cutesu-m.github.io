<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About Me</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    background-size: cover;
    background-position: center;
    transition: background-image 0.8s ease;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
  }
  body.sunrise    { background-image: url('images/sunrise.jpg'); }
  body.afternoon  { background-image: url('images/afternoon.jpg'); }
  body.sunset     { background-image: url('images/sunset.jpg'); }
  body.latenight  { background-image: url('images/latenight.jpg'); }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(20,20,30,0.55);
    padding: 40px;
    border-radius: 20px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
  }
  .emoji { font-size: 3rem; }
  h1 { margin-top: 0; color: #FFD9A0; }
  .stage-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #FFD9A0;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .nav-btns {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .nav-btns button {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    background: #FFD9A0;
    color: #222;
    font-weight: bold;
    cursor: pointer;
  }
  .nav-btns button:hover { opacity: 0.85; }
  .links a {
    display: inline-block;
    margin: 6px 8px;
    padding: 8px 16px;
    border-radius: 30px;
    background: #FFD9A0;
    color: #222;
    text-decoration: none;
    font-weight: bold;
  }
  .links a:hover { opacity: 0.85; }
  .dots {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFD9A0;
    opacity: 0.3;
  }
  .dots span.active { opacity: 1; }
</style>
</head>
<body class="sunrise">

<div class="card">
  <div class="emoji" id="emoji">🌅</div>
  <div class="stage-label" id="stageLabel">Sunrise · Welcome</div>
  <div id="content">
    <h1>Hi, welcome to my page 👋</h1>
    <p>I'm [Your Name]. Take a walk with me through the day — sunrise, afternoon, sunset, and night — and get to know me along the way.</p>
  </div>
  <div class="nav-btns">
    <button onclick="prevStage()">Back</button>
    <button onclick="nextStage()">Next</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const stages = [
    {
      cls: 'sunrise',
      emoji: '🌅',
      label: 'Sunrise · Welcome',
      html: `<h1>Hi, welcome to my page 👋</h1>
             <p>I'm [Your Name]. Take a walk with me through the day — sunrise, afternoon, sunset, and night — and get to know me along the way.</p>`
    },
    {
      cls: 'afternoon',
      emoji: '☀️',
      label: 'Afternoon · Introduction',
      html: `<h1>A little about me</h1>
             <p>I'm a [your role, e.g. "student developer"] studying [field] at [school/uni]. I enjoy building things and learning new skills, and this page is one of my projects!</p>`
    },
    {
      cls: 'sunset',
      emoji: '🌇',
      label: 'Sunset · Interests',
      html: `<h1>What I love</h1>
             <p>🎮 [Interest 1]<br>📚 [Interest 2]<br>🎨 [Interest 3]<br>🎵 [Interest 4]</p>`
    },
    {
      cls: 'latenight',
      emoji: '🌙',
      label: 'Late Night · Find Me',
      html: `<h1>Let's connect</h1>
             <div class="links">
               <a href="https://instagram.com/yourhandle" target="_blank">Instagram</a>
               <a href="https://linkedin.com/in/yourhandle" target="_blank">LinkedIn</a>
               <a href="https://github.com/yourhandle" target="_blank">GitHub</a>
               <a href="mailto:you@email.com">Email</a>
             </div>`
    }
  ];

  let current = 0;

  function render() {
    const s = stages[current];
    document.body.className = s.cls;
    document.getElementById('emoji').textContent = s.emoji;
    document.getElementById('stageLabel').textContent = s.label;
    document.getElementById('content').innerHTML = s.html;
    const dots = document.getElementById('dots');
    dots.innerHTML = stages.map((_, i) =>
      `<span class="${i === current ? 'active' : ''}"></span>`
    ).join('');
  }

  function nextStage() {
    current = (current + 1) % stages.length;
    render();
  }

  function prevStage() {
    current = (current - 1 + stages.length) % stages.length;
    render();
  }

  render();
</script>

</body>
</html>
