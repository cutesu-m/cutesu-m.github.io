<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About Me</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    background-size: cover;
    background-position: center;
    transition: background-image 0.8s ease;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
  }
  body.sunrise    { background-image: url("https://plus.unsplash.com/premium_photo-1676320526001-07b75bd19ae3?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8c3VucmlzZSUyMGxhbmRzY2FwZXxlbnwwfHwwfHx8MA%3D%3D"); }
  body.afternoon  { background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSywbGfhPBFYGqoWIaBieoSS1Wz7Qc6mUbxlvHAad8ehw&s=10"); }
  body.sunset     { background-image: url("https://template.canva.com/EAG2yQtjD8g/1/0/900w-I3bXINZdhEI.jpg"); }
  body.latenight  { background-image: url("https://mikkolagerstedt.com/images/generated/blog-heroes/images/blog/blog/the-art-of-night-photography/Mikko-Lagerstedt-Night-Of-Fog-1280w.avif"); }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(20,20,30,0.55);
    padding: 40px;
    border-radius: 20px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
  }
  .emoji { font-size: 3rem; }
  h1 { margin-top: 0; color: #FFD9A0; }
  .stage-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #FFD9A0;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .nav-btns {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .nav-btns button {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    background: #FFD9A0;
    color: #222;
    font-weight: bold;
    cursor: pointer;
  }
  .nav-btns button:hover { opacity: 0.85; }
  .links a {
    display: inline-block;
    margin: 6px 8px;
    padding: 8px 16px;
    border-radius: 30px;
    background: #FFD9A0;
    color: #222;
    text-decoration: none;
    font-weight: bold;
  }
  .links a:hover { opacity: 0.85; }
  .dots {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFD9A0;
    opacity: 0.3;
  }
  .dots span.active { opacity: 1; }
</style>
</head>
<body class="sunrise">

<div class="card">

  <div id="content">
   <h1>Hello!</h1>
     <p>I'm Howard. Welcome to my introductory page :3.</p>
  </div>
  <div class="nav-btns">
    <button onclick="prevStage()">Back</button>
    <button onclick="nextStage()">Next</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const stages = [
    {
           cls: 'sunrise',
      html: `<h1>Hello!</h1>
             <p>I'm Howard. Welcome to my introductory page :3.</p>`
    },
    {
           cls: 'afternoon',
      html: `<h1>Introduction about me</h1>
             <p>I am Howard Chen, a first year student, studying Civil Engineering at UNSW. I enjoy learning new skills and meeting new people. </p>`
    },
    {
           cls: 'sunset',
      html: `<h1>Some of my interests</h1>
             <p>1. Fencing<br>2. Exploring cultures(travelling and engaging internationally)<br>3. Board games(I have not dislike a single board game yet)<br>4. Doomscrolling (Unhealthily)</p>`
    },
    {
      cls: 'latenight',
      html: `<h1>My links/h1>
             <div class="links">
               <a href="https://www.instagram.com/howard_c0/">Instagram</a>
               <a href="https://www.linkedin.com/in/howard-chen-7ba2a324b/">LinkedIn</a>
              <a href="z5594727@ad.unsw.edu.au">Email</a>
             </div>`
    }
  ];

  let current = 0;

  function render() {
    const s = stages[current];
    document.body.className = s.cls;
    document.getElementById('emoji').textContent = s.emoji;
    document.getElementById('stageLabel').textContent = s.label;
    document.getElementById('content').innerHTML = s.html;
    const dots = document.getElementById('dots');
    dots.innerHTML = stages.map((_, i) =>
      `<span class="${i === current ? 'active' : ''}"></span>`
    ).join('');
  }

  function nextStage() {
    current = (current + 1) % stages.length;
    render();
  }

  function prevStage() {
    current = (current - 1 + stages.length) % stages.length;
    render();
  }

  render();
</script>

</body>
</html>
